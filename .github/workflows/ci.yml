name: Build and regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Check current runtime assets
        run: python -B scripts/check_assets.py
      - name: Install publication test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 fonts-noto-cjk
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: studio
      - name: Build, audit and test frontend
        run: |
          npm run build
          npm run audit:preview
          npm test
        working-directory: studio
      - name: Backend regressions
        env:
          PYTHONPATH: src
        run: .venv/bin/python -B -m unittest discover -s tests -v
